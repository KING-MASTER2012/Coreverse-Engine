[workspace]
members = [
    "engine/rust/common/*",
    "engine/rust/crates/*",
    "engine/rust/macros/*",
    "tools/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.90"
license = "GPL-3.0"

[workspace.dependencies]
syn = { version = "3.0.3", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
camino = "1.2.5"
inventory = "0.3.24"
thiserror = "2.0.19"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4+spec-1.1.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["formatting"] }
clap = { version = "4.6.5", features = ["derive"] }
anyhow = "1.0.104"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
