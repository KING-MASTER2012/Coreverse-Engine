[workspace]
members = [
    "engine/rust/common/*",
    "engine/rust/crates/*",
    "engine/rust/macros/*",
    "tools/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.90"
license = "GPL-3.0"

[workspace.dependencies]
syn = { version = "3.0.7", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
camino = "1.2.6"
inventory = "0.3.25"
thiserror = "2.0.21"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["formatting"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tempfile = "3.27.0"
libm = "0.2.16"
libc = "0.2.189"
windows-sys = "0.61.2"
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
