# cbindgen config for ffi.
#
# Requires cbindgen >= 0.28 — earlier versions cannot parse the
# `#[unsafe(no_mangle)]` attribute syntax the 2024 edition requires
# (cbindgen issue mozilla/cbindgen#1040, fixed in 0.28.0). Most OS
# package managers still ship something older than that (Ubuntu
# 24.04's apt package is 0.26.0, from 2023) — install with
# `cargo install cbindgen --locked` instead of relying on apt/brew/etc.

language = "C"
header = "// Auto-generated by cbindgen from engine/rust/crates/ffi — DO NOT EDIT."
include_guard = "COREVERSE_FFI_H"
autogen_warning = "/* Regenerate with `cbindgen --config cbindgen.toml --output <out>.h .` from this crate's directory. Do not hand-edit. */"

# Without this, the generated header has no `extern "C" { ... }` guard
# and every C++ translation unit that includes it will fail to link
# (the linker looks for the C++-mangled symbol instead of the plain
# C one). Confirmed the hard way — see PR notes.
cpp_compat = true

line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
