[package]
name = "ffi"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib: what Corrosion links into the C++ targets.
# rlib: so `cargo test -p ffi` keeps working like any other crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
ccore = { path = "../ccore" }
log-core = { path = "../log-core" }
log-sinks = { path = "../log-sinks" }
# Renamed on import: this crate's own `vfs` FFI module (src/vfs.rs)
# would otherwise collide with the external crate's name inside that
# same module (`use vfs::Foo;` inside `mod vfs { ... }` is ambiguous —
# see vfs.rs's module docs).
vfs-crate = { package = "vfs", path = "../vfs" }
camino.workspace = true

[lints]
workspace = true
