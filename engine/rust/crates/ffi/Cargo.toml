[package]
name = "ffi"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# staticlib: what Corrosion links into the C++ targets.
# rlib: so `cargo test -p ffi` keeps working like any other crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
ccore = { path = "../ccore" }
log-core = { path = "../log-core" }
log-sinks = { path = "../log-sinks" }
# Renamed on import: this crate's own `vfs` FFI module (src/vfs.rs)
# would otherwise collide with the external crate's name inside that
# same module (`use vfs::Foo;` inside `mod vfs { ... }` is ambiguous —
# see vfs.rs's module docs).
vfs-crate = { package = "vfs", path = "../vfs" }
# Renamed on import for the same reason as `vfs-crate`: this crate has its
# own `platform` FFI module (src/platform.rs).
platform-crate = { package = "platform", path = "../platform" }
camino.workspace = true

# The window backend (`winit`) for `ffi_platform_run`: desktop windows on
# Windows, macOS and Linux, and the application loop on iOS.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux", target_os = "ios"))'.dependencies]
platform-crate = { package = "platform", path = "../platform", features = ["winit"] }

# Android runs on a NativeActivity, which needs the `android-native-activity`
# feature of the platform crate (see src/android.rs for the entry point).
[target.'cfg(target_os = "android")'.dependencies]
platform-crate = { package = "platform", path = "../platform", features = ["android-native-activity"] }

[lints]
workspace = true
