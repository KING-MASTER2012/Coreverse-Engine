[package]
name = "platform"
description = "Coreverse's operating-system abstraction: system information, clocks and timers, standard directories, environment, process and thread helpers, and the window API with its headless and winit backends"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The desktop window backend, `platform::window::WinitBackend`, built on
# `winit`: real windows, monitors, cursor and fullscreen on Windows, macOS and
# Linux (X11 and Wayland). Off by default so the crate stays light for code
# that only needs the platform services or the headless backend.
winit = ["dep:winit", "dep:raw-window-metal"]

[dependencies]
camino.workspace = true
ccore = { path = "../ccore" }
thiserror.workspace = true
winit = { workspace = true, optional = true }

# Raw OS calls (sysconf/uname/sysctl) that std does not expose. All `unsafe`
# code of this crate lives in the private `sys` module.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true

# CAMetalLayer for the window's view (`NativeWindowHandle::Cocoa`/`UiKit`). The
# one place that needs it is the `unsafe` Apple part of the `sys` module.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
raw-window-metal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
