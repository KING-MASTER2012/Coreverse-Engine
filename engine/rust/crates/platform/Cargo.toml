[package]
name = "platform"
description = "Coreverse's operating-system abstraction: system information, clocks and timers, standard directories today; process and thread helpers next"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
camino.workspace = true
ccore = { path = "../ccore" }
thiserror.workspace = true

# Raw OS calls (sysconf/uname/sysctl) that std does not expose. All `unsafe`
# code of this crate lives in the private `sys` module.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Wdk_System_SystemServices",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
