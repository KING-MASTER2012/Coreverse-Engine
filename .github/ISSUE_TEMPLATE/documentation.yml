name: Documentation
description: Report missing or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation

body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: What is incorrect or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement

  - type: input
    id: page
    attributes:
      label: Affected Page (optional)
