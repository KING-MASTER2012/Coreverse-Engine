name: Deploy Documentation

on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "book.toml"
            - ".github/workflows/deploy-docs.yml"

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    # Safety net: without a book.toml at the repository root there is nothing to
    # build, so skip build and deploy instead of failing on `mdbook build`.
    check:
        runs-on: ubuntu-latest
        outputs:
            has_book: ${{ steps.detect.outputs.has_book }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Detect mdBook configuration
              id: detect
              run: |
                  if [ -f book.toml ]; then
                    echo "has_book=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_book=false" >> "$GITHUB_OUTPUT"
                    echo "No book.toml found - skipping documentation build and deploy."
                  fi

    build:
        needs: check
        if: needs.check.outputs.has_book == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install mdBook
              uses: peaceiris/actions-mdbook@v2
              with:
                  mdbook-version: '0.4.52'

            - name: Build Documentation
              run: mdbook build

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./book

    deploy:
        needs: build

        runs-on: ubuntu-latest

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
