name: Rust

on:
    workflow_call:

permissions:
    contents: read

jobs:
    rust:
        runs-on: ubuntu-latest

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - uses: actions/checkout@v7

            - name: Bootstrap
              shell: bash
              run: |
                  chmod +x devkit/scripts/setup/shell/bootstrap.sh
                  devkit/scripts/setup/shell/bootstrap.sh --rust-only

            - uses: Swatinem/rust-cache@v2

            - name: Cargo Check
              run: cargo check --workspace --all-features

            - name: Cargo Test
              run: cargo test --workspace --all-features

            # `--all-features` enables `std` and `no_std` together and `std`
            # wins, so the `libm` backend needs its own build and test run.
            - name: Cargo Check (math, no_std backend)
              run: cargo check -p math --no-default-features --features no_std

            - name: Cargo Test (math, no_std backend)
              run: cargo test -p math --no-default-features --features no_std

    # The Linux job above is the full gate (bootstrap toolchain, no_std
    # backend). The Rust crates also contain platform-specific code (memory
    # mapping and path handling in `fs`/`vfs`), so the workspace tests run on
    # Windows and macOS too, with the runners' own stable toolchain.
    rust-cross-platform:
        name: rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Cargo Test
              run: cargo test --workspace --all-features

    # The `platform` crate (and the `ffi` crate on top of it) has Android and iOS
    # code paths that no runner can execute. Type-check and lint them for their real targets so they cannot
    # rot unnoticed; nothing links, so no NDK or Xcode project is needed.
    platform-mobile:
        name: platform (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: aarch64-linux-android
                    - os: macos-latest
                      target: aarch64-apple-ios

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Cargo Check
              run: cargo check -p platform --target ${{ matrix.target }}

            - name: Clippy
              run: cargo clippy -p platform --target ${{ matrix.target }} -- -D warnings

            # The `ffi` crate builds the window event loop for C++ on top of
            # `platform`; on these targets it must compile without the desktop
            # backend (`winit` is a dependency of desktop targets only).
            - name: Cargo Check (ffi)
              run: cargo check -p ffi --target ${{ matrix.target }}

            - name: Clippy (ffi)
              run: cargo clippy -p ffi --target ${{ matrix.target }} -- -D warnings

    # The desktop window backend (`platform` with the `winit` feature) opens a
    # real window, so it needs an X server. Xvfb is a virtual one; a small
    # window manager (openbox) runs next to it because X11 fullscreen is a
    # request to the window manager. `CV_REQUIRE_DISPLAY` makes a missing
    # display an error instead of a skipped test. The `rust` job above compiles
    # the same code with `--all-features` but has no display, so the smoke test
    # skips itself there.
    platform-window-xvfb:
        name: platform (winit on Xvfb)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            # winit loads these at run time (dlopen); none is needed to build.
            - name: Install the X server and the libraries winit loads
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      xvfb openbox libx11-6 libxkbcommon0 libxkbcommon-x11-0 \
                      libxcursor1 libxi6 libxrandr2 libxcb1

            - name: Smoke test (Xvfb + openbox)
              env:
                  CV_REQUIRE_DISPLAY: "1"
                  CV_EXPECT_WM: "1"
              run: >
                  xvfb-run -a -s "-screen 0 1280x1024x24" bash -c
                  'openbox >/dev/null 2>&1 & sleep 2;
                  cargo test -p platform --features winit --test winit_smoke -- --nocapture'

            # Without a window manager fullscreen is a no-op; the test notes it
            # and still checks everything else.
            - name: Smoke test (Xvfb only)
              env:
                  CV_REQUIRE_DISPLAY: "1"
              run: >
                  xvfb-run -a -s "-screen 0 1280x1024x24"
                  cargo test -p platform --features winit --test winit_smoke -- --nocapture
