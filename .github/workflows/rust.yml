name: Rust

on:
    workflow_call:
        inputs:
            platform:
                description: >-
                    Run the mobile cross-checks and the window-system smoke test.
                    ci.yml turns this off for pull requests that touch neither the
                    ffi crate nor anything it depends on.
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    rust:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Bootstrap (--rust-only) only checked that this toolchain exists;
            # the setup action installs it (and the same one every other Rust job
            # uses).
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            # No separate `cargo check --workspace`: `cargo test` already compiles
            # every crate and its tests, and `lint.yml` type-checks the regular
            # (non-test) build of every crate through Clippy with the same
            # features, so a check pass only compiled everything a third time.
            - name: Cargo Test
              run: cargo test --workspace --all-features

            # `--all-features` enables `std` and `no_std` together and `std`
            # wins, so the `libm` backend needs its own build and test run.
            # Kept on purpose: a test build links `std`, so only this check
            # compiles the library itself as `no_std`.
            - name: Cargo Check (math, no_std backend)
              run: cargo check -p math --no-default-features --features no_std

            - name: Cargo Test (math, no_std backend)
              run: cargo test -p math --no-default-features --features no_std

    # The Linux job above is the full gate (the no_std backend as well). The Rust crates also contain platform-specific code (memory
    # mapping and path handling in `fs`/`vfs`), so the workspace tests run on
    # Windows and macOS too, with the runners' own stable toolchain.
    rust-cross-platform:
        name: rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-2025, macos-15]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Cargo Test
              run: cargo test --workspace --all-features

    # The `platform` crate (and the `ffi` crate on top of it) has Android and iOS
    # backends that no runner can execute. Type-check and lint them for their real targets, with the
    # features that turn the backend on, so they cannot rot unnoticed; nothing links, so no NDK or Xcode
    # project is needed. Android needs the activity feature (winit refuses to compile without one).
    platform-mobile:
        if: ${{ inputs.platform }}
        name: platform (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: aarch64-linux-android
                      features: android-native-activity
                    - os: macos-15
                      target: aarch64-apple-ios
                      features: winit

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}
                  components: clippy

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  key: ${{ matrix.target }}

            - name: Cargo Check
              run: cargo check -p platform --target ${{ matrix.target }}

            - name: Cargo Check (mobile backend)
              run: cargo check -p platform --features ${{ matrix.features }} --tests --target ${{ matrix.target }}

            - name: Clippy
              run: cargo clippy -p platform --target ${{ matrix.target }} -- -D warnings

            - name: Clippy (mobile backend)
              run: cargo clippy -p platform --features ${{ matrix.features }} --target ${{ matrix.target }} -- -D warnings

            # The `ffi` crate runs the window event loop for C++ on top of
            # `platform`. Its target-specific dependencies turn the mobile backend on
            # (`android-native-activity` on Android, `winit` on iOS), and on Android
            # it defines `android_main`.
            - name: Cargo Check (ffi)
              run: cargo check -p ffi --target ${{ matrix.target }}

            - name: Clippy (ffi)
              run: cargo clippy -p ffi --target ${{ matrix.target }} -- -D warnings

    # The desktop window backend (`platform` with the `winit` feature) opens a
    # real window, so it needs an X server. Xvfb is a virtual one; a small
    # window manager (openbox) runs next to it because X11 fullscreen is a
    # request to the window manager. `CV_REQUIRE_DISPLAY` makes a missing
    # display an error instead of a skipped test. The `rust` job above compiles
    # the same code with `--all-features` but has no display, so the smoke test
    # skips itself there.
    platform-window-xvfb:
        if: ${{ inputs.platform }}
        name: platform (winit on Xvfb)
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            # winit loads these at run time (dlopen); none is needed to build.
            - name: Install the X server and the libraries winit loads
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      xvfb openbox libx11-6 libxkbcommon0 libxkbcommon-x11-0 \
                      libxcursor1 libxi6 libxrandr2 libxcb1

            - name: Smoke test (Xvfb + openbox)
              env:
                  CV_REQUIRE_DISPLAY: "1"
                  CV_EXPECT_WM: "1"
              run: >
                  xvfb-run -a -s "-screen 0 1280x1024x24" bash -c
                  'openbox >/dev/null 2>&1 & sleep 2;
                  cargo test -p platform --features winit --test winit_smoke -- --nocapture'

            # Without a window manager fullscreen is a no-op; the test notes it
            # and still checks everything else.
            - name: Smoke test (Xvfb only)
              env:
                  CV_REQUIRE_DISPLAY: "1"
              run: >
                  xvfb-run -a -s "-screen 0 1280x1024x24"
                  cargo test -p platform --features winit --test winit_smoke -- --nocapture
