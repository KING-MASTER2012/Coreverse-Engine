name: Rust

on:
    workflow_call:

permissions:
    contents: read

jobs:
    rust:
        runs-on: ubuntu-latest

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - uses: actions/checkout@v7

            - name: Bootstrap
              shell: bash
              run: |
                  chmod +x devkit/scripts/setup/shell/bootstrap.sh
                  devkit/scripts/setup/shell/bootstrap.sh --rust-only

            - uses: Swatinem/rust-cache@v2

            - name: Cargo Check
              run: cargo check --workspace --all-features

            - name: Cargo Test
              run: cargo test --workspace --all-features

            # `--all-features` enables `std` and `no_std` together and `std`
            # wins, so the `libm` backend needs its own build and test run.
            - name: Cargo Check (math, no_std backend)
              run: cargo check -p math --no-default-features --features no_std

            - name: Cargo Test (math, no_std backend)
              run: cargo test -p math --no-default-features --features no_std

    # The Linux job above is the full gate (bootstrap toolchain, no_std
    # backend). The Rust crates also contain platform-specific code (memory
    # mapping and path handling in `fs`/`vfs`), so the workspace tests run on
    # Windows and macOS too, with the runners' own stable toolchain.
    rust-cross-platform:
        name: rust (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Cargo Test
              run: cargo test --workspace --all-features

    # The `platform` crate has Android and iOS backends that no runner can
    # execute. Type-check and lint them for their real targets so they cannot
    # rot unnoticed; nothing links, so no NDK or Xcode project is needed.
    platform-mobile:
        name: platform (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: aarch64-linux-android
                    - os: macos-latest
                      target: aarch64-apple-ios

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
                  components: clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Cargo Check
              run: cargo check -p platform --target ${{ matrix.target }}

            - name: Clippy
              run: cargo clippy -p platform --target ${{ matrix.target }} -- -D warnings
