name: "CodeQL"

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop

    schedule:
        - cron: "0 3 * * 0"

permissions:
    actions: read
    contents: read
    packages: read
    security-events: write

# Same rule as ci.yml: a new push to a pull request cancels its running
# analysis; pushes to main/develop and the weekly schedule are never cancelled.
concurrency:
    group: codeql-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # The C++ analysis builds the whole engine (and traces it), so it runs on
    # pushes to main/develop and on the weekly schedule, not on pull requests.
    # The Rust analysis is cheap and stays on pull requests.
    image:
        if: github.event_name != 'pull_request'
        uses: ./.github/workflows/image.yml
        permissions:
            contents: read
            packages: write

    analyze-cpp:
        name: Analyze (cpp)
        needs: image
        runs-on: ubuntu-24.04

        env:
            # The image has ccache, but CodeQL has to SEE every compiler run: a
            # compile that is a cache hit would be missing from the analysis.
            COREVERSE_COMPILER_LAUNCHER: none

        # The same toolchain image as cpp.yml: no Bootstrap, no apt.
        container:
            image: ${{ needs.image.outputs.ref }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Restore only: cpp.yml (and the nightly cache-warm run) save this
            # cache. Same image, compiler and triplet, so the packages are shared.
            - name: vcpkg binary cache
              uses: ./.github/actions/vcpkg-cache

            - name: Set up vcpkg
              shell: bash
              run: |
                  bash devkit/scripts/setup/shell/scripts/toolchain/check-vcpkg.sh
                  test -f third_party/vcpkg/scripts/buildsystems/vcpkg.cmake

            # Configure BEFORE initializing CodeQL: this is where the vcpkg
            # packages (Qt!) are installed if the cache has no copy, and that
            # build does not belong in the analysis. The preset is the one a
            # developer and cpp.yml use.
            - name: Configure (linux-x64-gcc)
              shell: bash
              run: cmake --preset linux-x64-gcc

            - name: Initialize CodeQL
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
              with:
                  languages: cpp

            - name: Build C++
              shell: bash
              run: cmake --build --preset linux-gcc-release

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

    analyze-rust:
        name: Analyze (rust)
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
              with:
                  languages: rust

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
