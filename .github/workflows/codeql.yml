name: "CodeQL"

on:
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop

    schedule:
        - cron: "0 3 * * 0"

permissions:
    actions: read
    contents: read
    security-events: write

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                language:
                    - cpp
                    - rust

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Rust
              if: matrix.language == 'cpp'
              uses: dtolnay/rust-toolchain@stable

            # Installs Rust/cbindgen AND vcpkg's C++ deps (VulkanHeaders, volk,
            # VulkanMemoryAllocator, ...), then configures CMake with the vcpkg
            # toolchain file (build/). Without this, "cmake -B build" below can't
            # find any vcpkg package - this replaces the old cbindgen-only setup,
            # which never touched vcpkg at all.
            - name: Bootstrap (Rust/cbindgen + vcpkg deps + CMake configure)
              if: matrix.language == 'cpp'
              shell: bash
              run: |
                  chmod +x devkit/scripts/setup/shell/bootstrap.sh
                  devkit/scripts/setup/shell/bootstrap.sh

            # See the identical step in cpp.yml for why these aren't part
            # of bootstrap.sh itself: libx11-dev/libwayland-dev are the
            # Xlib and Wayland WSI backends renderer needs to compile on
            # Linux, weston gives wayland_render_loop_test a headless
            # compositor to run against.
            - name: Install X11 & Wayland dev libraries
              if: matrix.language == 'cpp'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      libx11-dev \
                      libwayland-dev \
                      pkg-config \
                      weston

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}

            - name: Build C++
              if: matrix.language == 'cpp'
              run: cmake --build build --config Release

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v4
