name: Benchmarks

# Manual only: benchmark numbers from shared CI runners are too noisy to gate
# anything on. Runs every criterion suite in the workspace - today that is
# `math` (engine/rust/crates/math/benches). The `benchmarks/` directory at the
# repository root is still a placeholder for future cross-crate suites.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    benchmark:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - run: cargo bench --workspace
