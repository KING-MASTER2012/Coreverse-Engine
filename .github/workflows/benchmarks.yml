name: Benchmarks

# Manual only: benchmark numbers from shared CI runners are too noisy to gate
# anything on. Runs every criterion suite in the workspace - today that is
# `math` (engine/rust/crates/math/benches). The `benchmarks/` directory at the
# repository root is still a placeholder for future cross-crate suites.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    benchmark:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - run: cargo bench --workspace
