name: Stale Issues

on:
    schedule:
        - cron: "0 1 * * *"

jobs:
    stale:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
              with:
                  days-before-stale: 60
                  days-before-close: 30
                  stale-issue-label: stale
                  stale-pr-label: stale
