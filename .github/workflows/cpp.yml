name: C++

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap
        shell: bash
        run: |
          chmod +x devkit/scripts/setup/shell/bootstrap.sh
          devkit/scripts/setup/shell/bootstrap.sh

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Bootstrap
        shell: pwsh
        run: |
          devkit/scripts/setup/powershell/bootstrap.ps1

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release
