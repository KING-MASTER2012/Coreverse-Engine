<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Arka Plan Gradyanı -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- 'C' Harfi Renk Geçişi -->
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#C7CAE8" />
    </linearGradient>

    <!-- Mavi Yörünge Gradyanı -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Mor Yörünge Gradyanı -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <g transform="translate(0,0)">
    <!-- 1. Dış Yörünge Yayları -->
    <!-- Üst-Sağ Mavi Yay -->
    <path d="M 336.46 93.18 A 210 210 0 0 1 506.81 336.46" fill="none" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Alt-Sağ Beyaz Yay -->
    <path d="M 497.33 371.83 A 210 210 0 0 1 300 510" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Alt-Sol Mor Yay -->
    <path d="M 263.54 506.82 A 210 210 0 0 1 93.18 263.54" fill="none" stroke="url(#purpleGrad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Üst-Sol Beyaz Yay -->
    <path d="M 102.67 228.17 A 210 210 0 0 1 300 90" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- 2. Yörünge Düğümleri (Gezegen/Uydu Halkaları) -->
    <!-- Mavi Düğüm (Üst-Sağ) -->
    <g transform="translate(481.86, 195)">
      <circle r="13" fill="#07080C" stroke="#3B82F6" stroke-width="3.5" />
      <circle r="4.5" fill="#38BDF8" />
    </g>

    <!-- Mor Düğüm (Alt-Sol) -->
    <g transform="translate(139.13, 434.98)">
      <circle r="13" fill="#07080C" stroke="#8B5CF6" stroke-width="3.5" />
      <circle r="4.5" fill="#C084FC" />
    </g>

    <!-- 3. Yıldızlar ve Nokta Detayları -->
    <!-- Üst-Sol Yıldız -->
    <path d="M 205 158 Q 205 170 193 170 Q 205 170 205 182 Q 205 170 217 170 Q 205 170 205 158 Z" fill="#FFFFFF" />
    <circle cx="225" cy="148" r="2.5" fill="#FFFFFF" />
    <circle cx="188" cy="188" r="1.8" fill="#FFFFFF" opacity="0.8" />

    <!-- Alt-Sağ Yıldız -->
    <path d="M 395 430 Q 395 442 383 442 Q 395 442 395 454 Q 395 442 407 442 Q 395 442 395 430 Z" fill="#FFFFFF" />
    <circle cx="376" cy="452" r="2.5" fill="#FFFFFF" />
    <circle cx="412" cy="420" r="1.8" fill="#FFFFFF" opacity="0.8" />

    <!-- 4. Ana 'C' Formu -->
    <path d="M 416.4 202.3 
             A 152 152 0 1 0 416.4 397.7 
             L 370.4 349.3 
             A 86 86 0 1 1 370.4 250.7 
             Z" 
          fill="url(#cGrad)" />

    <!-- 5. İç Hedef / Nişangah Halkası -->
    <g stroke="#525C6A" stroke-width="3" stroke-linecap="round" fill="none">
      <!-- Nişangah Çizgileri -->
      <line x1="300" y1="230" x2="300" y2="242" />
      <line x1="300" y1="358" x2="300" y2="370" />
      <line x1="230" y1="300" x2="242" y2="300" />
      <line x1="358" y1="300" x2="370" y2="300" />

      <!-- İç Kesikli Yaylar -->
      <path d="M 311.28 235.98 A 65 65 0 0 1 364.02 288.72" />
      <path d="M 364.02 311.28 A 65 65 0 0 1 311.28 364.02" />
      <path d="M 288.72 364.02 A 65 65 0 0 1 235.98 311.28" />
      <path d="M 235.98 288.72 A 65 65 0 0 1 288.72 235.98" />
    </g>

    <!-- 6. Merkezdeki Altıgen -->
    <polygon points="316,272.29 332,300 316,327.71 284,327.71 268,300 284,272.29" fill="#FFFFFF" />
  </g>
</svg>
